name: ci
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Checks against the example
        run: python -m unittest discover -s checks -t .
      - name: Coverage with planted violations (fails if any detector is blind)
        run: python -m tools.coverage
